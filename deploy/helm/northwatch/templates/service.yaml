apiVersion: v1
kind: Service
metadata:
  name: {{ include "northwatch.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "northwatch.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "northwatch.selectorLabels" . | nindent 4 }}
