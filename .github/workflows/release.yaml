name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:  # always runs as snapshot dry-run; real releases require a v* tag push

permissions:
  contents: write  # required for goreleaser to create the GitHub Release

jobs:
  release:
    name: Run goreleaser
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run goreleaser
        uses: goreleaser/goreleaser-action@1a80836c5c9d9e5755a25cb59ec6f45a3b5f41a8  # v7.2.1
        with:
          version: 'v2.15.4'
          args: >-
            release --clean
            ${{ github.event_name == 'workflow_dispatch' && '--snapshot --skip=publish' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
