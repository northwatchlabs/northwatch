name: Run product e2e on main

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  e2e:
    name: Run product e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        timeout-minutes: 2

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6.4.0
        with:
          go-version-file: go.mod
        timeout-minutes: 3

      - name: Set up Helm
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2  # v5.0.0
        with:
          version: 4.2.0
        timeout-minutes: 1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3  # v4.1.0
        timeout-minutes: 1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5  # v4.1.0
        timeout-minutes: 1

      - name: Resolve chart appVersion
        id: appver
        run: |
          set -euo pipefail
          v=$(helm show chart deploy/helm/northwatch \
            | awk '/^appVersion:/ {gsub(/"/, "", $2); print $2; exit}')
          echo "value=$v" >> "$GITHUB_OUTPUT"

      - name: Build NorthWatch image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf  # v7.2.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64
          load: true
          tags: ghcr.io/northwatchlabs/northwatch:${{ steps.appver.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
        timeout-minutes: 5

      - name: Create kind cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc  # v1.14.0
        with:
          cluster_name: northwatch-e2e
          wait: 60s
        timeout-minutes: 3

      - name: Load image into kind
        run: |
          kind load docker-image \
            "ghcr.io/northwatchlabs/northwatch:${{ steps.appver.outputs.value }}" \
            --name northwatch-e2e
        timeout-minutes: 2

      - name: Run product e2e
        env:
          E2E_CLUSTER: northwatch-e2e
        run: |
          go test -tags=e2e -count=1 -timeout 10m -v ./test/e2e/...
        timeout-minutes: 12
