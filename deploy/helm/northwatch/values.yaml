image:
  repository: ghcr.io/northwatchlabs/northwatch
  tag: ""
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""

auth:
  existingSecret: ""
  existingSecretKey: token
  token: ""

rbac:
  create: true

# YAML config rendered into a ConfigMap and mounted at
# /etc/northwatch/northwatch.yaml. Override per environment.
# See examples/basic/northwatch.yaml in the repo for supported kinds.
config: |
  components:
    - kind: Deployment
      namespace: default
      name: example
      displayName: "Example Component (replace me)"

replicas: 1

service:
  port: 8080

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
podLabels: {}
imagePullSecrets: []
