{{- /*
Render the API-token Secret unless the user pointed `auth.existingSecret`
at a pre-existing Secret. Token resolution order:
  1. .Values.auth.token  — literal value (rendered verbatim)
  2. existing in-cluster Secret of the same name (via `lookup`)
  3. freshly generated 32-char alphanumeric

The lookup branch keeps the token stable across `helm upgrade`: helm
re-renders templates from scratch each upgrade, and without lookup the
token would rotate on every upgrade. lookup returns nil during
`helm template` / `helm install --dry-run`, which is fine — the
fallback random token is only ever rendered, never persisted, in those
paths.
*/ -}}
{{- if not .Values.auth.existingSecret -}}
{{- $secretName := printf "%s-api-token" (include "northwatch.fullname" .) -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $token := "" -}}
{{- if .Values.auth.token -}}
{{- $token = .Values.auth.token -}}
{{- else if and $existing $existing.data $existing.data.token -}}
{{- $token = (index $existing.data "token" | b64dec) -}}
{{- else -}}
{{- $token = randAlphaNum 32 -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "northwatch.labels" . | nindent 4 }}
type: Opaque
stringData:
  token: {{ $token | quote }}
{{- end -}}
