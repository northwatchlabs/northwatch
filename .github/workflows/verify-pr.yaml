name: Verify PR

on:
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read
  pull-requests: read

jobs:
  detect-changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      docs: ${{ steps.filter.outputs.docs }}
      helm: ${{ steps.filter.outputs.helm }}
    steps:
      - name: Checkout
        if: github.event_name == 'pull_request'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Filter changed paths
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d  # v4.0.1
        with:
          filters: |
            docs:
              - 'docs/**'
              - 'mkdocs.yml'
              - 'mise.toml'
              - '.github/workflows/verify-pr.yaml'
            helm:
              - 'deploy/helm/**'
              - 'deploy/docker/**'
              - 'cmd/**'
              - 'internal/**'
              - 'examples/basic/sample-deployment.yaml'
              - '.github/workflows/verify-pr.yaml'

  verify:
    name: Vet, test, lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Lint
        uses: golangci/golangci-lint-action@82606bf257cbaff209d206a39f5134f0cfbfd2ee  # v9.2.1
        with:
          version: v2.12.2

  build-cross:
    name: Build (cross-platform)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build ./cmd/northwatch

  goreleaser-snapshot:
    name: Run goreleaser snapshot
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run goreleaser snapshot
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94  # v7.2.3
        with:
          version: 'v2.15.4'
          args: release --snapshot --clean --skip=publish

  docs:
    name: Build docs (strict)
    needs: detect-changes
    runs-on: ubuntu-latest
    steps:
      - name: Skip docs build
        if: needs.detect-changes.outputs.docs != 'true' && github.event_name != 'merge_group'
        run: echo "No docs changes"

      - name: Checkout
        if: needs.detect-changes.outputs.docs == 'true' || github.event_name == 'merge_group'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up mise
        if: needs.detect-changes.outputs.docs == 'true' || github.event_name == 'merge_group'
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d  # v4.2.0
        with:
          version: 2026.5.6
          install: true
          cache: true

      - name: Build site with strict mode
        if: needs.detect-changes.outputs.docs == 'true' || github.event_name == 'merge_group'
        run: mise run docs-build

  helm:
    name: Lint and smoke (helm ${{ matrix.helm }})
    needs: detect-changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        helm: ["3.21.0", "4.2.0"]
    steps:
      - name: Checkout
        if: needs.detect-changes.outputs.helm == 'true' || github.event_name == 'merge_group'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up Helm
        if: needs.detect-changes.outputs.helm == 'true' || github.event_name == 'merge_group'
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310  # v5.0.1
        with:
          version: ${{ matrix.helm }}

      - name: Lint chart
        if: needs.detect-changes.outputs.helm == 'true' || github.event_name == 'merge_group'
        run: helm lint deploy/helm/northwatch

      - name: Set up QEMU
        if: needs.detect-changes.outputs.helm == 'true' || github.event_name == 'merge_group'
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3  # v4.1.0

      - name: Set up Buildx
        if: needs.detect-changes.outputs.helm == 'true' || github.event_name == 'merge_group'
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5  # v4.1.0

      - name: Resolve chart appVersion
        id: appver
        if: needs.detect-changes.outputs.helm == 'true' || github.event_name == 'merge_group'
        run: |
          set -euo pipefail
          v=$(helm show chart deploy/helm/northwatch \
            | awk '/^appVersion:/ {gsub(/"/, "", $2); print $2; exit}')
          echo "value=$v" >> "$GITHUB_OUTPUT"

      - name: Build NorthWatch image (tag = chart appVersion)
        if: needs.detect-changes.outputs.helm == 'true' || github.event_name == 'merge_group'
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf  # v7.2.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64
          load: true
          tags: ghcr.io/northwatchlabs/northwatch:${{ steps.appver.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create kind cluster
        if: needs.detect-changes.outputs.helm == 'true' || github.event_name == 'merge_group'
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc  # v1.14.0
        with:
          cluster_name: northwatch-smoke
          wait: 60s

      - name: Load image into kind
        if: needs.detect-changes.outputs.helm == 'true' || github.event_name == 'merge_group'
        run: |
          kind load docker-image \
            "ghcr.io/northwatchlabs/northwatch:${{ steps.appver.outputs.value }}" \
            --name northwatch-smoke

      - name: Smoke (apply workload + install chart + assert)
        if: needs.detect-changes.outputs.helm == 'true' || github.event_name == 'merge_group'
        # helm/kind-action above already created the cluster, so the
        # logic from deploy/helm/scripts/smoke.sh is inlined here
        # (skipping the kind create / delete steps the script does).
        run: |
          set -euo pipefail
          NAMESPACE=northwatch
          RELEASE=nw

          kubectl apply -f examples/basic/sample-deployment.yaml
          kubectl create namespace "$NAMESPACE" \
            --dry-run=client -o yaml | kubectl apply -f -

          helm install "$RELEASE" deploy/helm/northwatch \
            --namespace "$NAMESPACE" \
            --values deploy/helm/ci/smoke-values.yaml \
            --wait --timeout 120s

          kubectl -n "$NAMESPACE" wait deploy/"${RELEASE}-northwatch" \
            --for=condition=available --timeout=60s
          kubectl wait deploy/api-gateway \
            --for=condition=available --timeout=60s

          kubectl -n "$NAMESPACE" port-forward \
            "svc/${RELEASE}-northwatch" 18080:8080 >/dev/null 2>&1 &
          pf_pid=$!
          trap 'kill $pf_pid 2>/dev/null || true' EXIT

          for _ in 1 2 3 4 5; do
            sleep 1
            if curl -fsS http://localhost:18080/healthz >/dev/null 2>&1; then
              break
            fi
          done
          curl -fsS http://localhost:18080/healthz

          deadline=$(( $(date +%s) + 60 ))
          while :; do
            if curl -fsS http://localhost:18080/api/components \
              | jq -e '.[] | select(.name=="api-gateway" and .status=="operational")' \
              >/dev/null; then
              echo "api-gateway operational"
              break
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "timed out waiting for api-gateway operational" >&2
              curl -fsS http://localhost:18080/api/components || true
              exit 1
            fi
            sleep 2
          done

          # --wait blocks until cluster-scoped RBAC is actually gone,
          # not just marked for deletion — otherwise the gets below race.
          helm uninstall "$RELEASE" --namespace "$NAMESPACE" --wait --timeout 60s

          if kubectl get clusterrole "${RELEASE}-northwatch" >/dev/null 2>&1; then
            echo "ClusterRole survived uninstall" >&2
            exit 1
          fi
          if kubectl get clusterrolebinding "${RELEASE}-northwatch" >/dev/null 2>&1; then
            echo "ClusterRoleBinding survived uninstall" >&2
            exit 1
          fi

  e2e:
    name: Run product e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        timeout-minutes: 2

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version-file: go.mod
        timeout-minutes: 3

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310  # v5.0.1
        with:
          version: 4.2.0
        timeout-minutes: 1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3  # v4.1.0
        timeout-minutes: 1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5  # v4.1.0
        timeout-minutes: 1

      - name: Resolve chart appVersion
        id: appver
        run: |
          set -euo pipefail
          v=$(helm show chart deploy/helm/northwatch \
            | awk '/^appVersion:/ {gsub(/"/, "", $2); print $2; exit}')
          echo "value=$v" >> "$GITHUB_OUTPUT"

      - name: Build NorthWatch image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf  # v7.2.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64
          load: true
          tags: ghcr.io/northwatchlabs/northwatch:${{ steps.appver.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
        timeout-minutes: 5

      - name: Create kind cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc  # v1.14.0
        with:
          cluster_name: northwatch-e2e
          wait: 60s
        timeout-minutes: 3

      - name: Load image into kind
        run: |
          kind load docker-image \
            "ghcr.io/northwatchlabs/northwatch:${{ steps.appver.outputs.value }}" \
            --name northwatch-e2e
        timeout-minutes: 2

      - name: Run product e2e
        env:
          E2E_CLUSTER: northwatch-e2e
        run: |
          go test -tags=e2e -count=1 -timeout 10m -v ./test/e2e/...
        timeout-minutes: 12

  verify-image:
    name: Verify container image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3  # v4.1.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5  # v4.1.0

      - name: Build single-arch image for smoke test
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf  # v7.2.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64
          load: true
          tags: northwatch:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test image
        run: |
          set -euo pipefail
          # Run the image with its default CMD ("serve") plus --no-cluster.
          # No volumes — the baked-in default config and writable
          # /var/lib/northwatch should be enough for /healthz to come up.
          docker run -d --name nw -p 18080:8080 northwatch:smoke serve --no-cluster

          # Assert non-root by image config (catches regressions where
          # someone removes `USER nonroot`).
          user=$(docker inspect --format '{{.Config.User}}' northwatch:smoke)
          if [ "$user" != "nonroot:nonroot" ]; then
            echo "::error::expected image User=nonroot:nonroot, got '$user'"
            exit 1
          fi
          # And by the running process UID. `docker top` (no -o) prints
          # a header row then the process row; UID is the first column.
          uid=$(docker top nw | awk 'NR==2{print $1}')
          if [ "$uid" != "65532" ]; then
            echo "::error::expected container process UID=65532, got '$uid'"
            docker top nw >&2 || true
            exit 1
          fi

          # Wait for /healthz.
          for i in $(seq 1 30); do
            if curl -sfo /dev/null http://localhost:18080/healthz; then
              echo "healthz OK after ${i}s (user=$user, uid=$uid)"
              docker rm -f nw >/dev/null
              exit 0
            fi
            sleep 1
          done
          echo "::error::smoke test failed; container logs follow" >&2
          docker logs nw >&2 || true
          docker rm -f nw >/dev/null || true
          exit 1

      - name: Validate multi-arch build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf  # v7.2.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
