name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:  # always runs as snapshot dry-run; real releases require a v* tag push

permissions:
  contents: write  # required for goreleaser to create the GitHub Release

jobs:
  release:
    name: Run goreleaser
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run goreleaser
        uses: goreleaser/goreleaser-action@5daf1e915a5f0af01ddbcd89a43b8061ff4f1a89  # v7.2.2
        with:
          version: 'v2.15.4'
          args: >-
            release --clean
            ${{ github.event_name == 'workflow_dispatch' && '--snapshot --skip=publish' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
