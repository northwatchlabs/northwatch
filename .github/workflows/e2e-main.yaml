name: Run product e2e on main

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  e2e:
    name: Run product e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        timeout-minutes: 2

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version-file: go.mod
        timeout-minutes: 3

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310  # v5.0.1
        with:
          version: 4.2.0
        timeout-minutes: 1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8  # v4.2.0
        timeout-minutes: 1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0
        timeout-minutes: 1

      - name: Resolve chart appVersion
        id: appver
        run: |
          set -euo pipefail
          v=$(helm show chart deploy/helm/northwatch \
            | awk '/^appVersion:/ {gsub(/"/, "", $2); print $2; exit}')
          echo "value=$v" >> "$GITHUB_OUTPUT"

      - name: Build NorthWatch image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64
          load: true
          tags: ghcr.io/northwatchlabs/northwatch:${{ steps.appver.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
        timeout-minutes: 5

      - name: Create kind cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc  # v1.14.0
        with:
          cluster_name: northwatch-e2e
          wait: 60s
        timeout-minutes: 3

      - name: Load image into kind
        run: |
          kind load docker-image \
            "ghcr.io/northwatchlabs/northwatch:${{ steps.appver.outputs.value }}" \
            --name northwatch-e2e
        timeout-minutes: 2

      - name: Run product e2e
        env:
          E2E_CLUSTER: northwatch-e2e
        run: |
          go test -tags=e2e -count=1 -timeout 10m -v ./test/e2e/...
        timeout-minutes: 12
